# Default values for the Audit categorization interface.
# Run npm run defaults after editing, or restart the local app / rebuild.
# Saved browser preferences override these defaults where applicable.
interface:
  language: en                 # en | es
  model: gemma-cloud           # gemma-cloud (Amazon Bedrock)
  view: grid                   # grid | list
  autoCategorize: true
  simultaneousImages: 2        # 1–3 parallel cloud requests
  leftHanded: false
  cloudConsent: true
  showImageDetails: false
  showTroubleshooting: false
  prompt: >-
    Classify this image into exactly one category: Indoors, Outdoors, Documents, Computer screens.
    If the main subject is a computer monitor or a screenshot of a computer interface, choose Computer screens.
    If the main subject is a page, receipt, form, or printed document, choose Documents.
    Otherwise choose Indoors for an interior scene or Outdoors for an exterior scene.
    Return only JSON: {"category":"one of these categories","description":"one sentence, as short as possible, at most 180 characters"}.
document:
  type: pptx                   # docx | pptx
  orientation: portrait        # portrait | landscape
  rows: 7                      # 1–16
  columns: 2                   # 1–16
  layout: table                # table | cards (cards only apply to PowerPoint)
  addDescription: false
