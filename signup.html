<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audit · Create account</title></head><body data-mode="signup"><header><a class="brand" href="./">◉ Audit</a><h1 class="section-title" id="auth-title">Create account</h1></header><main class="account-page"><section class="settings-panel"><form id="auth-form"><label>Email<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label id="password-field">Password<input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256"><span class="small">At least 12 characters, including uppercase, lowercase, and a number.</span></label><label id="code-field" hidden>Email code<input id="code" inputmode="numeric" autocomplete="one-time-code"></label><button id="submit-auth" class="primary">Create account</button></form><p id="auth-status" role="status"></p><p><a href="./login.html">Log in</a></p><button id="forgot" class="quiet">Forgot password?</button><button id="resend" class="quiet">Resend verification code</button></section></main><script type="module" src="/src/auth-page.js"></script></body></html>
