<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164f46"><title>Audit · Sessions</title></head>
<body>
<header><a class="brand" href="./"><span class="brand-icon" aria-hidden="true">◉</span> Audit</a><h1 class="section-title">Sessions</h1><div class="header-actions"><details class="hamburger"><summary aria-label="Open navigation">☰</summary><nav><a href="./">Categorize</a><a href="./sessions.html" aria-current="page">Sessions</a><a href="./describe.html">Describe</a><a href="./#settings">Settings</a><button id="sign-out" class="quiet" hidden>Log out</button></nav></details></div></header>
<main class="sessions-page">
<section class="settings-panel"><h2>New session</h2><form id="create-session-form" class="session-create"><label>Session name<input id="create-session-name" maxlength="80" required autocomplete="off"></label><button id="create-session" class="primary" disabled>Create session</button></form></section>
<div class="session-list-heading"><h2>Your sessions</h2><button id="refresh-sessions" class="quiet" disabled>Refresh</button></div>
<p id="sessions-status" role="status" aria-live="polite">Loading sessions…</p>
<p id="no-sessions" hidden>No sessions yet. Create one to add photos.</p>
<div id="session-list" class="session-list"></div>
</main>
<dialog id="rename-session-dialog" class="session-management-dialog"><form id="rename-session-form"><h2>Rename session</h2><label>Session name<input id="rename-session-name" required maxlength="80" autocomplete="off"></label><div class="session-dialog-actions"><button type="button" id="cancel-rename" class="quiet">Cancel</button><button id="save-session-name" class="primary">Save</button></div><p id="rename-status" role="status"></p></form></dialog>
<dialog id="delete-session-dialog" class="session-management-dialog"><h2>Delete session?</h2><p id="delete-session-name"></p><p>This permanently deletes the session, its photos, and results from all your devices.</p><div class="session-dialog-actions"><button id="cancel-delete-session" class="quiet">Cancel</button><button id="confirm-delete-session" class="danger-button">Delete session</button></div></dialog>
<script type="module" src="/src/sessions-page.js"></script>
</body></html>
